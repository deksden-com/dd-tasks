<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Фаза Specification</title>
  <style>
    :root { color-scheme: light dark; --bg:#eef0ea; --paper:#fbfaf4; --ink:#171b17; --muted:#626a63; --line:#c7d0c4; --green:#176b5c; --amber:#b56a24; --blue:#2d5d83; }
    @media (prefers-color-scheme: dark) { :root { --bg:#11161a; --paper:#192026; --ink:#f2eadc; --muted:#b5bbb8; --line:#33404a; --green:#79c8ae; --amber:#dfae62; --blue:#8ebbd3; } }
    * { box-sizing: border-box; }
    body { margin:0; padding:14px; background:var(--bg); color:var(--ink); font-family:"Avenir Next","Gill Sans",Verdana,sans-serif; letter-spacing:0; }
    a { color:var(--green); text-decoration:none; } a:hover { text-decoration:underline; }
    .page { width:min(1180px, 100%); margin:0 auto; display:grid; gap:12px; }
    .topbar { display:flex; justify-content:space-between; gap:10px; color:var(--muted); font-size:13px; }
    .hero, .panel { border:1px solid var(--line); border-radius:8px; background:var(--paper); padding:14px; }
    h1 { margin:2px 0 8px; font-family:"Iowan Old Style",Georgia,serif; font-size:clamp(28px,2.8vw,38px); line-height:1.02; letter-spacing:0; }
    h2 { margin:0 0 8px; font-size:17px; letter-spacing:0; }
    p { margin:0; color:var(--muted); line-height:1.42; }
    .meta, .grid { display:grid; gap:8px; }
    .meta { grid-template-columns:repeat(4,minmax(0,1fr)); margin-top:12px; }
    .item { border-top:1px solid var(--line); padding-top:8px; min-width:0; overflow-wrap:anywhere; }
    .item:first-child { border-top:0; padding-top:0; }
    .label { display:block; color:var(--green); font-size:12px; font-weight:900; margin-bottom:3px; }
    .value { font-size:14px; }
    .value ul { margin:0; padding-left:20px; }
    .layout { display:grid; grid-template-columns:minmax(0,1fr) minmax(320px,.7fr); gap:12px; align-items:start; }
    details { border-top:1px solid var(--line); padding:9px 0; }
    summary { cursor:pointer; font-weight:800; }
    ul { margin:8px 0 0; padding-left:20px; color:var(--muted); }
    @media (max-width:860px) { .layout, .meta { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <script id="specification-data" type="application/json">
{
  "schema_id": "dd-flow/specification-stage-report@2",
  "run": {
    "run_id": "RUN-338-specification-template",
    "run_index": ".memory-bank/runs/RUN-338-specification-template/run-index.json"
  },
  "stage": {"name": "specify", "dir": "01-specify", "status": "completed"},
  "project": {"id": "PRJ-004-dd-memorybank", "title": "dd-memorybank"},
  "subject": {"id": "PRT-338-adaptive-planning-routing-capacity", "title": "Adaptive planning, routing and capacity"},
  "overall": {
    "verdict": "specified_ready_for_plan",
    "summary": "The task facts and compatibility projection are complete.",
    "next_action": "Enter plan."
  },
  "breadcrumbs": [],
  "specification": {
    "problem": "Planning depth and review capacity need independent, observable inputs.",
    "goal": "Choose the least expensive sufficient route without losing evidence.",
    "in_scope": ["task assessment", "legacy projection"],
    "out_of_scope": ["general scheduler"],
    "acceptance_criteria": ["The five assessment axes validate."],
    "verification_plan": "Validate the embedded packet against the canonical schema."
  },
  "questions": [],
  "task_profile": {
    "size": "large",
    "risk": "high",
    "planning_route_hint": "full_plan",
    "verification_mode": "automated"
  },
  "task_assessment": {
    "scope_breadth": {"level": "system_wide", "surfaces": ["specify", "plan", "eval"], "reason": "The report contract crosses flow stages."},
    "solution_novelty": {"level": "extend_existing", "surfaces": ["stage_reports", "routing"], "reason": "Existing stage-report and routing owners are extended."},
    "solution_uncertainty": {"level": "bounded", "surfaces": ["schemas", "validation"], "reason": "Compatibility behavior needs schema validation."},
    "failure_impact": {"level": "high", "surfaces": ["route_selection", "review_independence"], "reason": "A bad projection can select the wrong route."},
    "plan_floor": {"level": "full_plan", "surfaces": ["plan", "rollout"], "reason": "The versioned rollout crosses report contracts."}
  },
  "legacy_projection": {
    "size": "large",
    "risk": "high",
    "planning_route_hint": "full_plan",
    "verification_mode": "automated",
    "sources": {
      "size": "task_assessment.scope_breadth",
      "risk": "task_assessment.failure_impact",
      "planning_route_hint": "task_assessment.plan_floor",
      "verification_mode": "independent_policy"
    }
  },
  "handoff": {
    "plan_prompt": ".memory-bank/dd-flow/plan.md",
    "must_read": ["specification.md"],
    "next_gate": "plan"
  }
}
  </script>
  <main class="page">
    <div class="topbar"><span id="crumbs"></span><span id="stage"></span></div>
    <section class="hero">
      <div class="label" id="project"></div>
      <h1>Фаза Specification</h1>
      <p id="summary"></p>
      <div class="meta" id="meta"></div>
    </section>
    <section class="layout">
      <section class="panel">
        <h2>Спецификация задачи</h2>
        <div class="grid" id="specBlocks"></div>
      </section>
      <aside class="panel">
        <h2>Вопросы и приемка</h2>
        <div class="grid" id="questions"></div>
      </aside>
    </section>
    <section class="panel">
      <h2>Вводные и кандидаты знаний</h2>
      <div class="grid" id="knowledgeBlocks"></div>
    </section>
    <section class="panel">
      <h2>Requirements-gap analysis</h2>
      <div class="grid" id="gapBlocks"></div>
    </section>
  </main>
  <script>
    const data = JSON.parse(document.getElementById('specification-data').textContent);
    const text = (value, fallback = '') => value == null || value === '' ? fallback : String(value);
    const el = (tag, attrs = {}, children = []) => {
      const node = document.createElement(tag);
      Object.entries(attrs).forEach(([key, value]) => key === 'class' ? node.className = value : node.setAttribute(key, value));
      children.forEach(child => node.append(child));
      return node;
    };
    const item = (label, value) => el('div', { class: 'item' }, [el('span', { class: 'label' }, [label]), el('div', { class: 'value' }, [text(value, 'N/A')])]);
    const listText = (values, fallback = 'none') => Array.isArray(values) && values.length ? values.join('; ') : fallback;
    document.getElementById('crumbs').textContent = (data.breadcrumbs || []).map(x => x.label || x).join(' / ');
    document.getElementById('stage').textContent = text(data.stage && data.stage.status, 'specified');
    document.getElementById('project').textContent = text(data.project && data.project.title, 'Project');
    document.getElementById('summary').textContent = text(data.overall && data.overall.summary);
    document.getElementById('meta').append(
      item('protocol', data.subject && data.subject.id),
      item('verdict', data.overall && data.overall.verdict),
      item('next action', data.overall && data.overall.next_action),
      item('route', data.task_profile && data.task_profile.planning_route_hint)
    );
    const blocks = [
      ['Проблема', data.specification && data.specification.problem],
      ['Цель', data.specification && data.specification.goal],
      ['Scope', (data.specification && data.specification.in_scope || []).join('; ')],
      ['Non-goals', (data.specification && data.specification.out_of_scope || []).join('; ')],
      ['Acceptance', (data.specification && data.specification.acceptance_criteria || []).join('; ')],
      ['Проверка', data.specification && data.specification.verification_plan]
    ];
    document.getElementById('specBlocks').append(...blocks.map(([label, value]) => item(label, value)));
    const questions = data.questions || [];
    document.getElementById('questions').append(...(questions.length ? questions : [{ id:'none', question:'Открытых вопросов нет', status:'closed' }]).map(q => {
      const parts = [el('summary', {}, [`${text(q.id)}: ${text(q.status)}`])];
      parts.push(el('p', {}, [text(q.question || q.summary)]));
      if (q.why_it_matters) parts.push(el('p', {}, [`Зачем: ${text(q.why_it_matters)}`]));
      if (Array.isArray(q.options) && q.options.length) {
        parts.push(el('ul', {}, q.options.map(option => el('li', {}, [`${text(option.id)}. ${text(option.label)}${option.impact ? ' - ' + text(option.impact) : ''}`]))));
      }
      if (q.recommendation) parts.push(el('p', {}, [`Рекомендация: ${text(q.recommendation)}${q.recommendation_rationale ? ' - ' + text(q.recommendation_rationale) : ''}`]));
      if (q.answer) parts.push(el('p', {}, [`Ответ: ${text(q.answer)}`]));
      const d = el('details', {}, parts);
      return d;
    }));
    const raw = data.raw_intake || {};
    const extraction = data.knowledge_extraction || {};
    const candidates = data.knowledge_candidates || {};
    const layerSummary = Object.entries(candidates.by_target_layer || {}).map(([key, value]) => `${key}: ${value}`).join('; ');
    document.getElementById('knowledgeBlocks').append(
      item('raw intake', `${text(raw.status, 'not_recorded')} - ${text(raw.summary || raw.reason, 'N/A')}`),
      item('extraction', `${text(extraction.mode, 'not_applicable')} / ${text(extraction.status, 'skipped')}: ${text(extraction.summary, 'N/A')}`),
      item('candidates', `${text(candidates.total, 0)} total; ${text(layerSummary, 'no target layers')}`),
      item('confirmation/blockers', `${text(candidates.requires_user_confirmation, 0)} confirmation; ${text(candidates.blocked, 0)} blocked`)
    );
    const research = data.research_routing || {};
    const methods = data.method_applicability || [];
    const ledger = data.gap_analysis || {};
    const coverage = data.scenario_coverage || ledger.scenario_coverage || {};
    const methodSummary = methods.map(method => `${text(method.method)}: ${text(method.applicability)}${method.reason ? ' — ' + text(method.reason) : ''}`).join('; ');
    const analogySummary = (research.analogies || []).map(analogy => `${text(analogy.source)}: ${text(analogy.strength)}${analogy.proposed_default ? ' — ' + text(analogy.proposed_default) : ''}${analogy.user_confirmation_required ? ' (требует решения пользователя)' : ''}`).join('; ');
    const gapSummary = (ledger.gaps || []).map(gap => `${text(gap.id)} ${text(gap.category)} / ${text(gap.impact)} / ${text(gap.status)}`).join('; ');
    document.getElementById('gapBlocks').append(
      item('research route', `${text(research.selected_level, 'not_recorded')} — ${text(research.stop_reason, 'no stop reason')}`),
      item('research questions', listText(research.questions)),
      item('analogies', analogySummary || 'none recorded'),
      item('method applicability', methodSummary || 'baseline-only'),
      item('gap ledger', gapSummary || 'initial_gaps: none_detected'),
      item('happy paths', listText(coverage.happy_paths)),
      item('alternate paths', listText(coverage.alternate_paths)),
      item('error paths', listText(coverage.error_paths))
    );
  </script>
</body>
</html>
