<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Release Report</title>
  <style>
    :root { color-scheme: light dark; --bg: #f3f1e8; --panel: #fffdf7; --ink: #171915; --muted: #62685f; --line: #d3d0c2; --accent: #126b59; --warn: #a85f18; }
    [data-theme="dark"] { --bg: #121619; --panel: #1d2428; --ink: #f3efe5; --muted: #b8bdb7; --line: #374248; --accent: #78c7ae; --warn: #dfae62; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    .page { width: min(1180px, 100%); margin: 0 auto; display: grid; gap: 12px; }
    .hero, .grid > section, .wide { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 16px; }
    .hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: start; }
    h1, h2 { margin: 0; line-height: 1.1; letter-spacing: 0; }
    h1 { font-size: 28px; }
    h2 { font-size: 17px; margin-bottom: 10px; }
    .muted { color: var(--muted); }
    .pill { display: inline-flex; align-items: center; min-height: 30px; border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; margin: 0 6px 6px 0; color: var(--muted); }
    .pill b { color: var(--ink); margin-left: 5px; }
    .verdict { color: var(--accent); font-weight: 800; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    ul { padding-left: 20px; margin: 0; }
    li { margin: 5px 0; overflow-wrap: anywhere; }
    @media (max-width: 760px) { .hero, .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <div>
        <p class="muted" id="project"></p>
        <h1 id="title">Release Report</h1>
        <p id="summary" class="muted"></p>
      </div>
      <div>
        <div class="pill">verdict <b id="verdict"></b></div>
        <div class="pill">next <b id="next"></b></div>
      </div>
    </section>
    <section class="wide">
      <h2>Version Decision</h2>
      <div id="version"></div>
    </section>
    <section class="wide"><h2>Operational Access</h2><ul id="operationalAccess"></ul></section>
    <div class="grid">
      <section><h2>Release Set</h2><ul id="changes"></ul></section>
      <section><h2>Artifacts</h2><ul id="artifacts"></ul></section>
      <section><h2>Gates</h2><ul id="gates"></ul></section>
      <section><h2>Checks And Readback</h2><ul id="checks"></ul></section>
    </div>
  </main>
  <script id="release-data" type="application/json">
{}
  </script>
  <script>
    const data = JSON.parse(document.getElementById('release-data').textContent);
    const text = (id, value) => { document.getElementById(id).textContent = value || 'n/a'; };
    const item = (value) => `<li>${value}</li>`;
    const evidenceList = (rows = []) => rows.map((row) => item(`${row.label}: ${row.path}`)).join('') || item('none');
    text('project', `${data.project?.title || ''} / ${data.subject?.id || ''}`);
    text('title', data.subject?.title || 'Release Report');
    text('summary', data.overall?.summary);
    text('verdict', data.overall?.verdict);
    text('next', data.overall?.next_action);
    document.getElementById('version').innerHTML = [
      `<span class="pill">previous <b>${data.version_decision?.previous_version || 'n/a'}</b></span>`,
      `<span class="pill">selected <b>${data.version_decision?.selected_version || 'n/a'}</b></span>`,
      `<span class="pill">source <b>${data.version_decision?.decision_source || 'n/a'}</b></span>`
    ].join('');
    document.getElementById('changes').innerHTML = evidenceList(data.release_set?.included_changes);
    document.getElementById('operationalAccess').innerHTML = [
      item(`outcome: ${data.operational_access?.outcome || 'not recorded'}`),
      item(`identity / authority / target / approval: ${['identity', 'authority', 'target', 'approval'].map((key) => data.operational_access?.verdicts?.[key] || 'n/a').join(' / ')}`),
      item(`next: ${data.operational_access?.next_action || 'n/a'}`)
    ].join('');
    document.getElementById('artifacts').innerHTML = evidenceList(data.artifacts);
    document.getElementById('gates').innerHTML = (data.gates || []).map((gate) => item(`${gate.id}: ${gate.status} - ${gate.summary}`)).join('') || item('none');
    document.getElementById('checks').innerHTML = [
      ...(data.checks || []).map((check) => item(`${check.name}: ${check.status}`)),
      item(`readback: ${data.release_readback?.status || 'n/a'}`)
    ].join('');
  </script>
</body>
</html>
