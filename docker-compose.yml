services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dd_tasks_foundation_local
      POSTGRES_USER: dd_tasks
      POSTGRES_PASSWORD: dd_tasks_local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dd_tasks -d dd_tasks_foundation_local"]
      interval: 2s
      timeout: 2s
      retries: 30
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55433}:5432"
    volumes:
      - dd_tasks_foundation_pgdata:/var/lib/postgresql/data

volumes:
  dd_tasks_foundation_pgdata:
    name: dd_tasks_foundation_pgdata
